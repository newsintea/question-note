<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学びノート</title>
  <meta name="description" content="気になったことを調べて、わかったことを残していくノート。">
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
  <main class="wrap">
    <section class="intro">
      <h1>学びノート</h1>
      <p>気になったことを調べて、わかったことを残していくノート。</p>
    </section>

    <input class="search" type="search" id="search" placeholder="キーワードで探す" aria-label="キーワードで探す">
    <!--
      タグの一覧（ここに書いた順にボタンが並ぶ）。カンマ区切り。
      新しいタグはユーザーの確認を取ってから末尾に追加する。
    -->
    <div class="tag-filter" id="tag-filter" aria-label="タグで絞り込む" data-tags="IT"></div>

    <!--
      ノート一覧。新しいノートを ul の先頭に追加する。
      data-tags にはカンマ区切りでタグを書く（ノートページのタグと揃える）。
      例:
      <li data-tags="IT">
        <a class="title" href="notes/slug.html">タイトル</a>
        <div class="meta"><time datetime="YYYY-MM-DD">YYYY-MM-DD</time><span class="tags"></span></div>
      </li>
    -->
    <ul class="note-list" id="note-list">
    </ul>

    <p class="empty" id="empty" hidden>該当するノートがありません。</p>
    <p class="empty" id="no-notes" hidden>まだノートがありません。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">本文はAIが生成しています。正確な情報は各ノートの参考リンク先を確認してください。</div>
  </footer>

  <script>
    const items = [...document.querySelectorAll('#note-list li')];
    const search = document.getElementById('search');
    const filter = document.getElementById('tag-filter');
    const empty = document.getElementById('empty');
    let activeTag = new URLSearchParams(location.search).get('tag') || '';

    const splitTags = (s) => (s || '').split(',').map((t) => t.trim()).filter(Boolean);
    const tagsOf = (li) => splitTags(li.dataset.tags);

    // 各ノートのタグ表示と、タグごとの件数を作る（タグ一覧の順。一覧にないタグも末尾に出す）
    const counts = new Map(splitTags(filter.dataset.tags).map((t) => [t, 0]));
    items.forEach((li) => {
      const box = li.querySelector('.tags');
      tagsOf(li).forEach((tag) => {
        counts.set(tag, (counts.get(tag) || 0) + 1);
        const a = document.createElement('a');
        a.href = '?tag=' + encodeURIComponent(tag);
        a.textContent = tag;
        a.addEventListener('click', (e) => { e.preventDefault(); setTag(tag); });
        box.appendChild(a);
      });
    });
    if (activeTag && !counts.has(activeTag)) activeTag = '';

    // タグボタン
    const buttons = [['', 'すべて', items.length], ...[...counts].map(([t, n]) => [t, t, n])];
    buttons.forEach(([tag, label, n]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.tag = tag;
      b.append(label);
      const c = document.createElement('span');
      c.className = 'count';
      c.textContent = n;
      b.appendChild(c);
      b.addEventListener('click', () => setTag(tag === activeTag ? '' : tag));
      filter.appendChild(b);
    });

    function setTag(tag) {
      activeTag = tag;
      const url = tag ? '?tag=' + encodeURIComponent(tag) : location.pathname;
      history.replaceState(null, '', url);
      render();
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      let shown = 0;
      items.forEach((li) => {
        const hitTag = !activeTag || tagsOf(li).includes(activeTag);
        const hitText = !q || li.textContent.toLowerCase().includes(q);
        li.hidden = !(hitTag && hitText);
        if (!li.hidden) shown++;
      });
      filter.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tag === activeTag)));
      empty.hidden = shown > 0 || items.length === 0;
      document.getElementById('no-notes').hidden = items.length > 0;
    }

    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
